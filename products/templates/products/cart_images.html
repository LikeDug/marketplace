<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина</title><style>body{margin:0;background:#f6f7fb;color:#172033;font:16px Segoe UI,Arial}.wrap{max-width:900px;margin:40px auto;padding:0 16px}a{color:#5b38f0;text-decoration:none;font-weight:700}.box{margin-top:20px;background:#fff;padding:24px;border-radius:18px}.item{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #e7e8ef}.photo{width:72px;height:72px;object-fit:cover;border-radius:10px}.name{flex:1}.name h3{margin:0 0 6px}.quantity{display:flex;border:1px solid #dddfe8;border-radius:8px;overflow:hidden}.quantity button{border:0;background:#fff;width:30px;font-size:18px}.quantity span{padding:6px 10px}.price{font-weight:800}.remove{border:0;background:#fff0f1;color:#bd2442;padding:8px;border-radius:7px}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding-top:20px}.order{width:100%;margin-top:16px;background:#5b38f0;color:#fff;border:0;border-radius:9px;padding:15px;font-weight:700}@media(max-width:600px){.item{flex-wrap:wrap}.name{min-width:calc(100% - 90px)}.price{margin-left:auto}}</style></head><body><main class="wrap"><a href="{% url 'catalog' %}">← Продолжить покупки</a><section class="box"><h1>Корзина</h1>{% for item in items %}<div class="item"><img class="photo" src="{{ item.product.image_url }}" alt="{{ item.product.name }}"><div class="name"><h3>{{ item.product.name }}</h3><span>{{ item.product.category.name }}</span></div><form class="quantity" method="post" action="{% url 'cart_update' item.product.pk %}">{% csrf_token %}<button name="action" value="decrease">−</button><span>{{ item.quantity }}</span><button name="action" value="increase">+</button></form><strong class="price">{{ item.line_total }} сом</strong><form method="post" action="{% url 'cart_remove' item.product.pk %}">{% csrf_token %}<button class="remove">Удалить</button></form></div>{% empty %}<p>Корзина пуста.</p>{% endfor %}{% if items %}<div class="total"><span>Итого</span><span>{{ total }} сом</span></div><button class="order">Оформить заказ</button>{% endif %}</section></main></body></html>
