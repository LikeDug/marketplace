<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ product.name }} — Marketplace</title><style>body{margin:0;background:#f6f7fb;color:#172033;font-family:Segoe UI,Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(960px,calc(100% - 32px));margin:42px auto}.back{color:#5b38f0;font-weight:700}.card{margin-top:22px;background:#fff;border:1px solid #e8eaf2;border-radius:20px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.art{min-height:370px;display:grid;place-items:center;background:linear-gradient(135deg,#e9e5ff,#c4d9ff);font-size:120px}.info{padding:42px}.category{color:#5b38f0;font-weight:700;font-size:14px}.price{font-size:32px;font-weight:800;margin:26px 0}.buy{width:100%;border:0;border-radius:10px;background:#5b38f0;color:#fff;padding:15px;font-size:16px;font-weight:800;cursor:pointer}@media(max-width:680px){.card{grid-template-columns:1fr}.art{min-height:220px}.info{padding:26px}}</style></head><body><main class="wrap"><a class="back" href="{% url 'catalog' %}">← Вернуться в каталог</a><section class="card"><div class="art">🛍️</div><div class="info"><div class="category">{{ product.category.name }}</div><h1>{{ product.name }}</h1><p>{{ product.description }}</p><div class="price">{{ product.price }} ₸</div><button class="buy">Добавить в корзину</button></div></section></main></body></html>
