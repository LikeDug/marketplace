<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ product.name }}</title><style>body{margin:0;background:#f6f7fb;font:16px Segoe UI,Arial;color:#172033}.wrap{max-width:950px;margin:40px auto;padding:0 16px}a{color:#5b38f0;text-decoration:none;font-weight:700}.card{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:18px;overflow:hidden}.photo{width:100%;height:400px;object-fit:cover}.info{padding:36px}.category{color:#5b38f0;font-weight:700}.price{font-size:30px;font-weight:800;margin:28px 0}.buy{width:100%;border:0;border-radius:9px;padding:15px;background:#5b38f0;color:#fff;font-weight:700;font-size:16px}@media(max-width:650px){.card{grid-template-columns:1fr}.photo{height:270px}}</style></head><body><main class="wrap"><a href="{% url 'catalog' %}">← Каталог</a><section class="card"><img class="photo" src="{{ product.image_url }}" alt="{{ product.name }}"><div class="info"><div class="category">{{ product.category.name }}</div><h1>{{ product.name }}</h1><p>{{ product.description }}</p><div class="price">{{ product.price }} сом</div><form method="post" action="{% url 'cart_add' product.pk %}">{% csrf_token %}<button class="buy">Добавить в корзину</button></form></div></section></main></body></html>
