<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Регистрация</title>
    <style>
        body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f6f7fb; color: #172033; }
        .wrap { max-width: 480px; margin: 80px auto; padding: 0 16px; }
        .card { background: #fff; border: 1px solid #e6e8f0; border-radius: 16px; padding: 32px; }
        h1 { margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 14px; }
        form p { margin: 0; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; font-weight: 700; color: #2b3450; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dfe3ee;
            border-radius: 10px;
            background: #fdfdff;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        input:focus {
            outline: none;
            border-color: #5b38f0;
            box-shadow: 0 0 0 4px rgba(91, 56, 240, 0.12);
            background: #fff;
        }
        input:hover { border-color: #b8bfe0; }
        button { border: 0; border-radius: 10px; background: #5b38f0; color: #fff; font-weight: 700; padding: 12px 18px; cursor: pointer; }
        .errorlist { list-style: none; padding: 0; margin: 0; color: #c92f4f; font-size: 14px; }
        .links { margin-top: 16px; font-size: 14px; }
        a { color: #5b38f0; text-decoration: none; }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card">
            <h1>Создать аккаунт</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Зарегистрироваться</button>
            </form>
            <div class="links">
                <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
            </div>
        </section>
    </main>
</body>
</html>
